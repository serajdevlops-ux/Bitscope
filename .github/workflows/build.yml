name: "Cross-Platform Build"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies & Tauri CLI
        run: |
          if [ -f package.json ]; then
            npm install
          fi
          npm install -g @tauri-apps/cli@latest

      - name: Fetch Required Compiler Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          BASE="https://raw.githubusercontent.com/tauri-apps/tauri/1.x/tooling/cli/templates/app/src-tauri/icons"
          curl -sL "$BASE/32x32.png" -o src-tauri/icons/32x32.png
          curl -sL "$BASE/128x128.png" -o src-tauri/icons/128x128.png
          curl -sL "$BASE/128x128@2x.png" -o src-tauri/icons/128x128@2x.png
          curl -sL "$BASE/icon.icns" -o src-tauri/icons/icon.icns
          curl -sL "$BASE/icon.ico" -o src-tauri/icons/icon.ico
          curl -sL "$BASE/icon.png" -o src-tauri/icons/icon.png

      - name: Build Tauri App
        run: npx tauri build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.AppImage
            src-tauri/target/release/*.deb
