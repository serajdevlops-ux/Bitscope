name: "Cross-Platform Full Build"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # ==========================================
  # 1. DESKTOP BUILDS (Windows, Linux, macOS)
  # ==========================================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-22.04'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure package.json exists and configure for Tauri
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "bitscope", "private": true, "scripts": {"build": "echo \"No frontend build required\"", "tauri": "tauri"}}' > package.json
          else
            npm pkg set scripts.tauri="tauri" || true
          fi

      - name: Install Frontend Dependencies & Tauri CLI
        shell: bash
        run: |
          npm install
          npm install @tauri-apps/cli@latest
          npm install -g @tauri-apps/cli@latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Fetch Required Compiler Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          BASE="https://raw.githubusercontent.com/tauri-apps/tauri/1.x/tooling/cli/templates/app/src-tauri/icons"
          curl -sL "$BASE/32x32.png" -o src-tauri/icons/32x32.png
          curl -sL "$BASE/128x128.png" -o src-tauri/icons/128x128.png
          curl -sL "$BASE/128x128@2x.png" -o src-tauri/icons/128x128@2x.png
          curl -sL "$BASE/icon.icns" -o src-tauri/icons/icon.icns
          curl -sL "$BASE/icon.ico" -o src-tauri/icons/icon.ico
          curl -sL "$BASE/icon.png" -o src-tauri/icons/icon.png

      - name: Build Tauri App
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: npx tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.AppImage
            src-tauri/target/release/*.deb

  # ==========================================
  # 2. ANDROID BUILD (.apk)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure package.json exists and configure for Tauri
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "bitscope", "private": true, "scripts": {"build": "echo \"No frontend build required\"", "tauri": "tauri"}}' > package.json
          else
            npm pkg set scripts.tauri="tauri" || true
          fi

      - name: Install Frontend Dependencies & Tauri CLI
        shell: bash
        run: |
          npm install
          npm install @tauri-apps/cli@latest
          npm install -g @tauri-apps/cli@latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk

      - name: Fetch Required Compiler Icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          BASE="https://raw.githubusercontent.com/tauri-apps/tauri/1.x/tooling/cli/templates/app/src-tauri/icons"
          curl -sL "$BASE/32x32.png" -o src-tauri/icons/32x32.png
          curl -sL "$BASE/128x128.png" -o src-tauri/icons/128x128.png
          curl -sL "$BASE/128x128@2x.png" -o src-tauri/icons/128x128@2x.png
          curl -sL "$BASE/icon.png" -o src-tauri/icons/icon.png

      - name: Build Android APK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          # Accept Android licenses
          yes | sdkmanager --licenses || true
          
          # Detect the installed NDK directory
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$(ls -1 $ANDROID_SDK_ROOT/ndk | head -n 1)"
          echo "Using NDK_HOME: $NDK_HOME"
          
          # Initialize and build Android project
          npx tauri android init || true
          npx tauri android build --apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitscope-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
