<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Crucial for mobile apps to prevent zooming and scaling issues -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BitScope Code Editor</title>
  <style>
    /* ==========================================================
       ACODE MOBILE-NATIVE DARK THEME
       ========================================================== */
    :root {
      --bg-dark: #121319;
      --bg-editor: #181920;
      --bg-sidebar: #0d0e12;
      --bg-surface: #21232d;
      --accent: #7aa2f7;
      --green-btn: #9ece6a;
      --text-main: #a9b1d6;
      --text-muted: #565f89;
      --border-color: #292e42;
      --font-mono: 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on mobile */
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* 1. TOP NAVBAR (Clean Icon-Based) */
    .top-bar {
      height: 56px;
      background-color: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Icon Buttons (Replaces the broken text/emojis) */
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .icon-btn:active {
      background: var(--bg-surface);
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .icon-accent { color: var(--accent); }
    .icon-green { color: var(--green-btn); }

    /* 2. SIDEBAR (Sliding Mobile Drawer) */
    .sidebar {
      position: absolute;
      top: 56px; /* Below top bar */
      left: -280px; /* Hidden by default */
      width: 260px;
      height: calc(100vh - 56px);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }

    .sidebar.open {
      left: 0;
    }

    /* Dark overlay when sidebar is open */
    .sidebar-overlay {
      position: absolute;
      top: 56px;
      left: 0;
      width: 100vw;
      height: calc(100vh - 56px);
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
    }

    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-header {
      padding: 16px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-color);
    }

    .file-tree {
      list-style: none;
      padding: 8px;
      overflow-y: auto;
    }

    .file-item {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .file-item:active, .file-item.active {
      background-color: rgba(122, 162, 247, 0.15);
      color: var(--accent);
    }

    /* 3. EDITOR WORKSPACE (Full Width) */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-editor);
    }

    .tab-bar {
      height: 40px;
      background-color: var(--bg-dark);
      display: flex;
      align-items: flex-end;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      padding: 10px 20px;
      font-size: 0.85rem;
      background: var(--bg-editor);
      color: #fff;
      border-top: 2px solid var(--accent);
      white-space: nowrap;
    }

    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .line-numbers {
      width: 45px;
      padding: 12px 0;
      background-color: var(--bg-editor);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.5;
      text-align: right;
      padding-right: 12px;
      user-select: none;
      border-right: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .code-area {
      flex: 1;
      height: 100%;
      background: transparent;
      color: var(--text-main);
      border: none;
      outline: none;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      tab-size: 2;
      white-space: pre;
      word-wrap: normal;
      overflow-x: auto;
      overflow-y: auto;
    }

    /* 4. FOOTER STATUS BAR */
    .status-bar {
      height: 28px;
      background-color: var(--bg-dark);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 5. LIVE PREVIEW MODAL */
    .preview-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .preview-header {
      height: 56px;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-weight: bold;
    }
    .preview-frame {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #fff;
    }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- TOP TOOLBAR -->
    <header class="top-bar">
      <div class="brand-section">
        <!-- Hamburger Menu Icon -->
        <button class="icon-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <span class="brand-title">BitScope</span>
      </div>
      <div class="action-group">
        <!-- Folder Icon -->
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </button>
        <!-- Save Icon -->
        <button class="icon-btn icon-accent" onclick="saveFile()">
          <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        </button>
        <!-- Play Icon -->
        <button class="icon-btn icon-green" onclick="runTestApp()">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
    </header>

    <!-- SIDEBAR OVERLAY & DRAWER -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Filesystem</div>
      <ul class="file-tree">
        <li class="file-item active" onclick="switchFile('index.html')">📄 index.html</li>
        <li class="file-item" onclick="switchFile('style.css')">🎨 style.css</li>
        <li class="file-item" onclick="switchFile('main.rs')">⚙️ main.rs</li>
        <li class="file-item" onclick="switchFile('app.exe')">📦 app.exe (Hex)</li>
      </ul>
    </aside>

    <!-- WORKSPACE AREA -->
    <main class="workspace">
      <div class="tab-bar">
        <div class="tab active" id="current-tab">index.html</div>
      </div>
      <div class="editor-body">
        <div class="line-numbers" id="line-numbers">1</div>
        <textarea 
          class="code-area" 
          id="code-editor" 
          spellcheck="false" 
          oninput="updateEditor()"
          onscroll="syncScroll()"
        ></textarea>
      </div>
    </main>

    <!-- STATUS BAR -->
    <footer class="status-bar">
      <span id="file-type-status">HTML Mode</span>
      <span id="cursor-status">Lines: 1</span>
    </footer>
  </div>

  <!-- TEST APP PREVIEW MODAL -->
  <div class="preview-modal" id="preview-modal">
    <div class="preview-header">
      <span>Live Preview</span>
      <button class="icon-btn" style="color:white; background:#333;" onclick="closePreview()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <iframe class="preview-frame" id="preview-frame"></iframe>
  </div>

  <input type="file" id="fileInput" onchange="handleFileOpen(event)" />

  <script>
    /* ==========================================================
       EDITOR LOGIC
       ========================================================== */
    const codeEditor = document.getElementById('code-editor');
    const lineNumbers = document.getElementById('line-numbers');
    const currentTab = document.getElementById('current-tab');
    const fileTypeStatus = document.getElementById('file-type-status');
    const cursorStatus = document.getElementById('cursor-status');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    const files = {
      'index.html': '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { background: #121212; color: #00ffcc; font-family: sans-serif; text-align: center; padding-top: 50px; }\n  </style>\n</head>\n<body>\n  <h1>BitScope Works!</h1>\n  <button onclick="alert(\'Success!\')">Click Me</button>\n</body>\n</html>',
      'style.css': 'body {\n  margin: 0;\n  padding: 0;\n}',
      'main.rs': 'fn main() {\n    println!("BitScope Mobile Active");\n}',
      'app.exe': '00000000: 4d 5a 90 00 03 00 00 00 04 00 00 00 ff ff 00 00\n00000010: b8 00 00 00 00 00 00 00 40 00 00 00 00 00 00 00'
    };

    let activeFileName = 'index.html';
    codeEditor.value = files[activeFileName];
    updateEditor();

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function updateEditor() {
      const lines = codeEditor.value.split('\n').length;
      let lineNumsHtml = '';
      for (let i = 1; i <= lines; i++) {
        lineNumsHtml += i + '<br>';
      }
      lineNumbers.innerHTML = lineNumsHtml;
      cursorStatus.innerText = `Lines: ${lines}`;
      files[activeFileName] = codeEditor.value;
    }

    function syncScroll() {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    }

    function switchFile(fileName) {
      activeFileName = fileName;
      currentTab.innerText = fileName;
      codeEditor.value = files[fileName] || '';

      if (fileName.endsWith('.exe')) fileTypeStatus.innerText = 'Binary (Hex) Mode';
      else if (fileName.endsWith('.html')) fileTypeStatus.innerText = 'HTML Mode';
      else fileTypeStatus.innerText = 'Text Mode';

      updateEditor();
      toggleSidebar(); // Close sidebar after selecting file on mobile
    }

    function handleFileOpen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      if (file.name.endsWith('.exe') || file.name.endsWith('.bin') || file.name.endsWith('.apk')) {
        reader.readAsArrayBuffer(file);
        reader.onload = function(e) {
          const buffer = new Uint8Array(e.target.result);
          let hexString = '';
          for (let i = 0; i < Math.min(buffer.length, 512); i += 16) {
            let chunk = Array.from(buffer.slice(i, i + 16))
              .map(b => b.toString(16).padStart(2, '0')).join(' ');
            hexString += i.toString(16).padStart(8, '0') + ': ' + chunk + '\n';
          }
          files[file.name] = hexString;
          switchFile(file.name);
        };
      } else {
        reader.readAsText(file);
        reader.onload = function(e) {
          files[file.name] = e.target.result;
          switchFile(file.name);
        };
      }
    }

    function saveFile() {
      const blob = new Blob([codeEditor.value], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = activeFileName;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function runTestApp() {
      document.getElementById('preview-modal').style.display = 'flex';
      document.getElementById('preview-frame').srcdoc = codeEditor.value;
    }

    function closePreview() {
      document.getElementById('preview-modal').style.display = 'none';
    }
  </script>
</body>
</html>
