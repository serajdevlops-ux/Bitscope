<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BitScope Code Editor</title>
  <style>
    :root {
      --bg-dark: #121319;
      --bg-editor: #181920;
      --bg-sidebar: #0d0e12;
      --bg-surface: #21232d;
      --bg-terminal: #090a0f;
      --accent: #7aa2f7;
      --green-btn: #9ece6a;
      --danger: #f7768e;
      --text-main: #a9b1d6;
      --text-muted: #565f89;
      --border-color: #292e42;
      --font-mono: 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body, html {
      width: 100%; height: 100%; background-color: var(--bg-dark); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    }

    .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }

    /* TOP NAVBAR */
    .top-bar {
      height: 56px; background-color: var(--bg-dark); display: flex; align-items: center;
      justify-content: space-between; padding: 0 8px; border-bottom: 1px solid var(--border-color); z-index: 10;
    }
    .brand-section { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-weight: 700; font-size: 1.2rem; color: #fff; }
    .action-group { display: flex; align-items: center; gap: 4px; }

    /* SVG ICON BUTTONS */
    .icon-btn {
      background: transparent; border: none; color: var(--text-main); width: 36px; height: 36px;
      border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn:active { background: var(--bg-surface); }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .icon-accent { color: var(--accent); }
    .icon-green { color: var(--green-btn); }
    .icon-danger { color: var(--danger); width: 28px !important; height: 28px !important; }

    /* SIDEBAR DRAWER */
    .sidebar {
      position: absolute; top: 56px; left: -280px; width: 280px; height: calc(100vh - 56px);
      background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; transition: left 0.3s ease; z-index: 50;
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay {
      position: absolute; top: 56px; left: 0; width: 100vw; height: calc(100vh - 56px);
      background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 40;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: auto; }

    .sidebar-header {
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-header span { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .sidebar-actions { display: flex; gap: 4px; }
    
    .file-tree { list-style: none; padding: 8px; overflow-y: auto; flex: 1; }
    .file-item {
      padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
    }
    .file-item-name { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item-name svg { width: 16px; height: 16px; flex-shrink: 0; }
    .file-item:active, .file-item.active { background-color: rgba(122, 162, 247, 0.15); color: var(--accent); }
    
    .folder-group { margin-left: 10px; border-left: 1px dashed var(--border-color); padding-left: 4px; }
    .folder-title {
      padding: 6px 8px; font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer;
    }

    /* WORKSPACE */
    .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg-editor); }
    .tab-bar {
      height: 40px; background-color: var(--bg-dark); display: flex; align-items: flex-end;
      border-bottom: 1px solid var(--border-color); padding-left: 8px;
    }
    .tab {
      padding: 10px 20px; font-size: 0.85rem; background: var(--bg-editor); color: #fff;
      border-top: 2px solid var(--accent); white-space: nowrap; display: none;
    }
    .tab.active { display: block; }
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px;
    }

    .editor-body { flex: 1; display: flex; position: relative; overflow: hidden; }
    .line-numbers {
      width: 45px; padding: 12px 0; background-color: var(--bg-editor); color: var(--text-muted);
      font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.5; text-align: right;
      padding-right: 12px; border-right: 1px solid rgba(255,255,255,0.05); overflow: hidden;
    }
    .code-area {
      flex: 1; height: 100%; background: transparent; color: var(--text-main); border: none; outline: none;
      padding: 12px; font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.5; resize: none;
      white-space: pre; word-wrap: normal; overflow-x: auto; overflow-y: auto;
    }

    /* TERMINAL */
    .terminal-container {
      height: 30%; background: var(--bg-terminal); border-top: 1px solid var(--border-color);
      display: none; flex-direction: column; font-family: var(--font-mono); font-size: 0.85rem;
    }
    .terminal-container.open { display: flex; }
    .terminal-header {
      background: var(--bg-dark); padding: 4px 12px; font-size: 0.75rem; color: var(--text-muted);
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
    }
    .terminal-output { flex: 1; padding: 8px; overflow-y: auto; color: #a9b1d6; }
    .terminal-input-row { display: flex; padding: 0 8px 8px 8px; align-items: center; }
    .terminal-prompt { color: var(--green-btn); margin-right: 8px; }
    .terminal-input {
      flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: inherit; outline: none;
    }

    /* STATUS BAR */
    .status-bar {
      height: 28px; background-color: var(--bg-dark); border-top: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 0.75rem; color: var(--text-muted);
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="top-bar">
      <div class="brand-section">
        <button class="icon-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <span class="brand-title">BitScope</span>
      </div>
      <div class="action-group">
        <button class="icon-btn icon-green" onclick="runCode()" title="Run Code">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleTerminal()" title="Toggle Terminal">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.11-.89-2-2-2zm0 14H4V8h16v10zm-2-1h-6v-2h6v2zM7.5 17l-1.41-1.41L8.67 13l-2.59-2.59L7.5 9l4 4-4 4z"/></svg>
        </button>
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload File">
          <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8l-6-6zm0 12H4V8h16v10z"/></svg>
        </button>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Filesystem</span>
        <div class="sidebar-actions">
          <button class="icon-btn" onclick="createNewFolder()" title="New Folder">
            <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8l-6-6zm0 12H4V8h16v10z"/></svg>
          </button>
          <button class="icon-btn" onclick="createNewFile()" title="New File">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          </button>
        </div>
      </div>
      <div class="file-tree" id="file-list"></div>
    </aside>

    <main class="workspace">
      <div class="tab-bar" id="tab-bar">
        <div class="tab" id="current-tab">Untitled</div>
      </div>
      
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" style="width: 48px; height: 48px; fill: var(--text-muted); margin-bottom: 12px;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <h3>No File Open</h3>
        <p>Create a file or folder from the sidebar to start coding.</p>
      </div>

      <div class="editor-body" id="editor-body" style="display: none;">
        <div class="line-numbers" id="line-numbers">1</div>
        <textarea class="code-area" id="code-editor" spellcheck="false" oninput="updateEditor()" onscroll="syncScroll()"></textarea>
      </div>

      <div class="terminal-container" id="terminal-container">
        <div class="terminal-header">
          <span>Terminal & Output</span>
          <span style="cursor:pointer;" onclick="toggleTerminal()">✕</span>
        </div>
        <div class="terminal-output" id="terminal-output">
          <div>BitScope Shell v1.0.0 — Ready. Click the Run (▶) button to execute code.</div>
        </div>
        <div class="terminal-input-row">
          <span class="terminal-prompt">~/project $</span>
          <input type="text" class="terminal-input" id="terminal-input" onkeypress="handleTerminal(event)">
        </div>
      </div>
    </main>

    <footer class="status-bar">
      <span id="file-type-status">Ready</span>
      <span id="cursor-status">-</span>
    </footer>
  </div>

  <input type="file" id="fileInput" onchange="handleFileOpen(event)" />

  <script>
    const codeEditor = document.getElementById('code-editor');
    const lineNumbers = document.getElementById('line-numbers');
    const currentTab = document.getElementById('current-tab');
    const fileTypeStatus = document.getElementById('file-type-status');
    const cursorStatus = document.getElementById('cursor-status');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const fileListEl = document.getElementById('file-list');

    let files = {}; // Stores path -> content
    let activeFileName = null;

    // Comprehensive language icons based on extension
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      
      // Icons SVG paths
      const icons = {
        py: '<svg viewBox="0 0 24 24" fill="#3572A5"><path d="M11.5 2c-3.1 0-3 1.3-3 1.3v1.7h6V6H8.3s-.3 0-.3.3v1.7h6.7V9H6.3s-1.3 0-1.3 1.3v4.3c0 1.3 1.3 1.3 1.3 1.3h1.7v-2.3s0-.7.7-.7h4.7s.7 0 .7-.7V9.7H11.5z"/></svg>',
        js: '<svg viewBox="0 0 24 24" fill="#f7df1e"><path d="M3 3h18v18H3V3zm16.5 14.5v-1.2c-.6.3-1.3.5-2 .5-1.1 0-1.6-.5-1.6-1.4 0-1.1.8-1.5 2.3-1.5h1.3v-1.1c0-.7-.3-1-1.1-1-.6 0-1.2.2-1.7.5l-.5-1.1c.7-.4 1.6-.7 2.6-.7 1.6 0 2.4.8 2.4 2.2v3.6h-1.4zm-8.8 0c-1.3 0-2.2-.6-2.6-1.5l1.2-.7c.3.5.7.8 1.4.8.7 0 1.1-.3 1.1-.9 0-.6-.4-.8-1.4-1.2-1.1-.4-2-.9-2-2.1 0-1.2 1-2 2.4-2 1.1 0 1.9.5 2.3 1.3l-1.1.7c-.2-.4-.6-.7-1.2-.7-.6 0-1 .3-1 .8 0 .5.4.7 1.3 1.1 1.2.5 2.1 1 2.1 2.2 0 1.3-1 2.1-2.6 2.1z"/></svg>',
        html: '<svg viewBox="0 0 24 24" fill="#e34f26"><path d="M3 2l2.3 17.5L12 22l6.7-2.5L21 2H3zm15 4.5l-.2 2.3H7.5l.3 3.5h10.2l-.8 8-5 1.7-5-1.7-.4-4.5h2.3l.2 2.5 2.9 1 2.9-1 .4-4.5H8.2L7 7h11z"/></svg>',
        css: '<svg viewBox="0 0 24 24" fill="#1572B6"><path d="M3 2l2.3 17.5L12 22l6.7-2.5L21 2H3zm15 4.5l-.2 2.3H7.5l.3 3.5h10.2l-.7 7.5-4.8 1.6-4.8-1.6-.4-4.5h2.3l.2 2.5 2.7.9 2.7-.9.4-4.5H8.2L7 7h11z"/></svg>',
        cpp: '<svg viewBox="0 0 24 24" fill="#00599C"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm3.5 5a1 1 0 100 2 1 1 0 000-2zm7 0a1 1 0 100 2 1 1 0 000-2zm-9.5 4h3v1.5H6v2h2v1.5H6a2 2 0 01-2-2v-1a2 2 0 012-2zm6 0h4a1 1 0 011 1v1h-3v1h2a1 1 0 011 1v1a1 1 0 01-1 1h-4v-1.5h3.5v-1H14v-1h3.5v-1H14V12zm4-1.5V9h-2v1.5h2z"/></svg>',
        rs: '<svg viewBox="0 0 24 24" fill="#dea584"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 3.3l6.5 3.2-6.5 3.2L5.5 8.5 12 5.3zM4 10.4l7 3.5v7l-7-3.5v-7zm9 10.5v-7l7-3.5v7l-7 3.5z"/></svg>',
        json: '<svg viewBox="0 0 24 24" fill="#cbcb41"><path d="M5 3h2v2H5v2a2 2 0 01-2 2v2a2 2 0 012 2v2h2v2H5v2h2v2H3V3h2zm14 0h-2v2h2v2a2 2 0 002 2v2a2 2 0 00-2 2v2h-2v2h2v2h4V3h-4z"/></svg>',
        default: '<svg viewBox="0 0 24 24" fill="#7aa2f7"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>'
      };

      const ext = filename.split('.').pop().toLowerCase();
      return icons[ext] || icons.default;
    }

    function renderSidebar() {
      fileListEl.innerHTML = "";
      
      // Group files into folders
      let tree = {};
      for (const path in files) {
        let parts = path.split('/');
        let curr = tree;
        for (let i = 0; i < parts.length - 1; i++) {
          let folder = parts[i];
          if (!curr[folder]) curr[folder] = {};
          curr = curr[folder];
        }
        curr[parts[parts.length - 1]] = path; // Leaf node stores full path
      }

      function renderNode(node, prefix = '') {
        let html = '';
        for (const key in node) {
          if (typeof node[key] === 'object') {
            html += `
              <div class="folder-group">
                <div class="folder-title">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="#e0af68"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                  <span>${key}</span>
                </div>
                ${renderNode(node[key], prefix + key + '/')}
              </div>
            `;
          } else {
            let fullPath = node[key];
            let isActive = fullPath === activeFileName;
            let icon = getFileIcon(fullPath);
            html += `
              <div class="file-item ${isActive ? 'active' : ''}" onclick="switchFile('${fullPath}')">
                <div class="file-item-name">
                  ${icon} <span>${key}</span>
                </div>
                <button class="icon-btn icon-danger" onclick="deleteFile('${fullPath}', event)" title="Delete">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
              </div>
            `;
          }
        }
        return html;
      }

      fileListEl.innerHTML = renderNode(tree);

      if (activeFileName) {
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('editor-body').style.display = 'flex';
        currentTab.classList.add('active');
        currentTab.innerText = activeFileName;
      } else {
        document.getElementById('empty-state').style.display = 'flex';
        document.getElementById('editor-body').style.display = 'none';
        currentTab.classList.remove('active');
        fileTypeStatus.innerText = "Ready";
        cursorStatus.innerText = "-";
      }
    }

    function createNewFile() {
      const path = prompt("Enter file path (e.g., app.py or src/main.js):");
      if (!path || path.trim() === "") return;
      if (!files[path]) files[path] = ""; 
      switchFile(path);
    }

    function createNewFolder() {
      const folder = prompt("Enter folder name (e.g., src/components):");
      if (!folder || folder.trim() === "") return;
      const dummyFile = folder.endsWith('/') ? folder + '.keep' : folder + '/.keep';
      files[dummyFile] = "";
      renderSidebar();
    }

    function deleteFile(path, event) {
      event.stopPropagation();
      if(confirm(`Delete ${path}?`)) {
        delete files[path];
        if (activeFileName === path) {
          activeFileName = null;
          codeEditor.value = "";
        }
        renderSidebar();
      }
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    function switchFile(fileName) {
      if (fileName.endsWith('.keep')) return;
      activeFileName = fileName;
      codeEditor.value = files[fileName] || '';
      
      const ext = fileName.split('.').pop().toLowerCase();
      fileTypeStatus.innerText = `${ext.toUpperCase()} Mode`;

      updateEditor();
      renderSidebar();
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }

    function updateEditor() {
      if(!activeFileName) return;
      const lines = codeEditor.value.split('\n').length;
      let lineNumsHtml = '';
      for (let i = 1; i <= lines; i++) lineNumsHtml += i + '<br>';
      lineNumbers.innerHTML = lineNumsHtml;
      cursorStatus.innerText = `Lines: ${lines}`;
      files[activeFileName] = codeEditor.value;
    }

    function syncScroll() {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    }

    function handleFileOpen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsText(file);
      reader.onload = function(e) {
        files[file.name] = e.target.result;
        switchFile(file.name);
      };
    }

    function toggleTerminal() {
      document.getElementById('terminal-container').classList.toggle('open');
    }

    function runCode() {
      if (!activeFileName) {
        alert("Please open a file to run!");
        return;
      }
      toggleTerminal();
      const output = document.getElementById('terminal-output');
      const content = codeEditor.value;
      const ext = activeFileName.split('.').pop().toLowerCase();

      output.innerHTML += `<div><span style="color:#9ece6a;">$ running ${activeFileName}</span></div>`;

      if (ext === 'html') {
        let win = window.open();
        win.document.write(content);
        win.document.close();
        output.innerHTML += `<div style="color:#7aa2f7;">> Opened HTML preview window successfully.</div>`;
      } else if (ext === 'js') {
        try {
          let originalLog = console.log;
          console.log = function(...args) {
            output.innerHTML += `<div>> ${args.join(' ')}</div>`;
          };
          let res = eval(content);
          if (res !== undefined) {
            output.innerHTML += `<div style="color:#9ece6a;">> Result: ${res}</div>`;
          }
          console.log = originalLog;
        } catch (err) {
          output.innerHTML += `<div style="color:#f7768e;">Error: ${err.message}</div>`;
        }
      } else {
        output.innerHTML += `<div style="color:#e0af68;">> Simulated execution for .${ext}: Code compiled successfully. No syntax errors detected.</div>`;
      }
      output.scrollTop = output.scrollHeight;
    }

    function handleTerminal(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('terminal-input');
        const output = document.getElementById('terminal-output');
        const val = input.value;
        if (val.trim() === 'clear') {
          output.innerHTML = '';
        } else {
          output.innerHTML += `<div><span style="color:#9ece6a;">~/project $</span> ${val}</div>`;
          output.innerHTML += `<div style="color:#565f89;">bash: ${val.split(' ')[0]}: command not found</div>`;
        }
        input.value = '';
        output.scrollTop = output.scrollHeight;
      }
    }
  </script>
</body>
</html>
